name: Deploy Public Results to GitHub Pages

on:
  push:
    branches:
      - public-results

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-public-results"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: public-results

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd public-results && npm ci

      - name: Build
        run: cd public-results && npm run build
        env:
          DEPLOY_TARGET: ghpages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-results/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
