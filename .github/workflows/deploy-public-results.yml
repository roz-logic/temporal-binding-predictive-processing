name: Deploy Public Results to GitHub Pages

on:
  push:
    branches:
      - main                    # ← CHANGED: Triggers on main
      - public-results

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-public-results"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          cd public-results
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-results/dist      # ← Results app dist

      - name: Deploy to /public-results
        id: deployment
        uses: actions/deploy-pages@v4

